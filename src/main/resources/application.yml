server:
  port: 8083

spring:
  application:
    name: api-gateway

AUTH_SERVICE_URL: 'http://localhost:8084'
FILE_SERVICE_URL: 'http://localhost:8081'
COURSE_SERVICE_URL: 'http://localhost:8085'
NOTIFICATION_SERVICE_URL: 'http://localhost:8082'
RAG_SERVICE_URL: 'http://localhost:8000'

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-min-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
